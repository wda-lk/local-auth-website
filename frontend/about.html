<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Make sure a District and Local Authority is setup -->
		<script>
			let districtId = localStorage.getItem("districtId")
			let localAuthorityId = localStorage.getItem("localAuthorityId")
			let localAuthorityObj = JSON.parse(localStorage.getItem("localAuthorityObj"))
			if (districtId == null || localAuthorityId == null) {
				window.location.href = "./index.html"
			}
			let hostName = `${document.location.protocol}//${document.location.hostname}`
		</script>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="Access web pages of Sri Lankan Local Authorities">
		<meta name="author" content="Wayamba Development Authority">
		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<!-- Custom Global CSS -->
		<link rel="stylesheet" type="text/css" href="assets/css/custom-global.css">
	</head>
	<script id="meta-data-tmpl" type="x-tmpl-mustache">
			<title>{{name}}</title>
			<link rel="icon" type="image/png" href=https://drive.google.com/uc?id={{favicon}}>
	</script>

	<body>
		<!-- Navigation -->
		<div id="navbar" class="container-fluid" style="background-color:#900; margin-bottom:20px;">
		</div>

		<div class="container-fluid">
			<div class="row">
				<!-- Left Column -->
				<div class="col-sm-3" style="margin-bottom:20px;">
					<!-- List-Group Panel -->
					<div class="card">
						<div class="card-header">
							<h5 class="card-title"><span class="glyphicon glyphicon-tasks"></span>Navigation
							</h5>
						</div>
						<div class="list-group">
							<a href="./home.html" class="list-group-item list-group-item-action">Home Page</a>
							<a href="./about.html" class="list-group-item list-group-item-action">About Us</a>
							<a href="./services.html" class="list-group-item list-group-item-action">E-Citizen Services</a>
							<a href="https://kuliyapitiyauc.cat2020.org/" class="list-group-item list-group-item-action">Registration</a>
							<a href="./downloads.html" class="list-group-item list-group-item-action">Download</a>
							<a href="./contacts.html" class="list-group-item list-group-item-action">Contact Us</a>
						</div>
					</div>
				</div>

				<!-- Center Column -->
				<div id="statements-text" class="col-sm-6"></div>
				<script id="statements-tmpl" type="x-tmpl-mustache">
					<blockquote id="vision-text" class="blockquote text-center">
						<h2 class="media-heading">දැක්ම</h2>
						<p>{{missionStatement}}</p>
					</blockquote>
					<blockquote id="mission-text" class="blockquote text-center">
						<h2 class="media-heading">මෙහෙවර</h2>
						<p>{{viewStatement}}</p>
					</blockquote>
				</script>

				<!-- Right Column -->
				<div class="col-sm-3">
					<!-- List-Group Panel -->
					<div class="card">
						<div class="card-header">
							<h5 class="card-title">
								<span class="glyphicon glyphicon-wrench"></span>Our Services</h5>
						</div>
						<div class="list-group">
							<a href="#" class="list-group-item list-group-item-action">Complain</a>
							<a href="#" class="list-group-item list-group-item-action">Issuing Certificates</a>
							<a href="#" class="list-group-item list-group-item-action">Rates Payments</a>
							<a href="#" class="list-group-item list-group-item-action">Application for Water Bowser</a>
							<a href="#" class="list-group-item list-group-item-action">Application for Gully Bowser</a>
							<a href="#" class="list-group-item list-group-item-action">Street Light Complain</a>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Footer -->
		<div id="footer" class="footer"></div>

		<!-- JQuery JS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js" integrity="sha512-STof4xm1wgkfm7heWqFJVn58Hm3EtS31XFaagaa8VMReCXAkQnJZ+jEy8PCC/iT18dFy95WcExNHFTqLyp72eQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<!-- Popper JS -->
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
		<!-- Bootstrap JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
		<!-- Mustache JS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.1.0/mustache.min.js" integrity="sha512-WJoegbZkRk/oQbcp2Nm2JfgrHHyHdhaHns2g74rXFRxxy+E+syUWQCiZxSzGo0662p/GQEVXDkg6ImtSR60DHg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<!-- Script for static HTML -->
		<script src="assets/js/component-loader.js"></script>
		<script src="assets/js/template-renderer.js"></script>
	</body>

	<script>
		$(function () {
			loadNav("assets/common")
			loadFooter("assets/common")

			let template = $("#meta-data-tmpl").html()
			let rendered = Mustache.render(template, localAuthorityObj)
			$("head").append(rendered)

			$.ajax({
				type: "GET", url: `${hostName}:8080/api/local-auths/${localAuthorityId}`,
				success: function (result) {
					console.log(result)
					template = $("#statements-tmpl").html()
					rendered = Mustache.render(template, result)
					$("#statements-text").append(rendered)
				},
				error: function (xhr) {
					console.log(`An error occurred: ${xhr.status} ${xhr.statusText}`)
				}
			})
		})
	</script>
</html>
