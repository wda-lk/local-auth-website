<!DOCTYPE html>
<html lang="en">
	<!-- Make sure a District and Local Authority is setup -->
	<script>
		let districtId = localStorage.getItem("districtId")
		let localAuthorityId = localStorage.getItem("localAuthorityId")
		let localAuthorityObj = JSON.parse(localStorage.getItem("localAuthorityObj"))
		if (districtId == null || localAuthorityId == null) {
			window.location.href = "./index.html"
		}
	</script>

	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
		<!-- Bootstrap Core CSS -->
		<link rel="stylesheet" type="text/css" href="./css/bootstrap.css">
		<!-- Custom CSS: You can use this stylesheet to override any Bootstrap styles and/or apply your own styles -->
		<link rel="stylesheet" type="text/css" href="./css/custom.css">
		<!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
		<!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
		<!--[if lt IE 9]>
		<script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
		<script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
		<![endif]-->
	</head>

	<body>
		<!-- Navigation -->
		<div class="container-fluid" style="background-color:#900; margin-bottom:20px;">
			<div class="row text-sm-left text-center" style="height:100px; align-items: center; justify-content: space-evenly;">
				<div id="logo-nav" class="col-sm-2 text-sm-right text-center"></div>
				<!-- server -->
				<div id="name-nav" class="col-sm-5"></div>
				<div class="col-sm-1">
					<a href="#" style="color:#CCC; text-decoration:none;">English</a>
				</div>
				<div class="col-sm-2">
					<img src="./images/common-logo.png" width="100" height="36" alt="">
				</div>
			</div>
		</div>

		<div class="container-fluid">
			<div class="row">
				<!-- Left Column -->
				<div class="col-sm-3" style="margin-bottom:20px;">
					<!-- List-Group Panel -->
					<div class="card">
						<div class="card-header">
							<h5 class="card-title"><span class="glyphicon glyphicon-tasks"></span>Navigation
							</h5>
						</div>
						<div class="list-group">
							<a href="./home.html" class="list-group-item list-group-item-action">Home Page</a>
							<a href="./about.html" class="list-group-item list-group-item-action">About Us</a>
							<a href="./services.html" class="list-group-item list-group-item-action">E-Citizen Services</a>
							<a href="https://kuliyapitiyauc.cat2020.org/" class="list-group-item list-group-item-action">Registration</a>
							<a href="./downloads.html" class="list-group-item list-group-item-action">Download</a>
							<a href="./contacts.html" class="list-group-item list-group-item-action">Contact Us</a>
						</div>
					</div>
				</div>

				<!-- Center Column -->
				<div id="statements-text" class="col-sm-6"></div>
				<script id="statements-tmpl" type="x-tmpl-mustache">
					<blockquote id="vision-text" class="blockquote text-center">
						<h2 class="media-heading">දැක්ම</h2>
						<p>{{missionStatement}}</p>
					</blockquote>
					<blockquote id="mission-text" class="blockquote text-center">
						<h2 class="media-heading">මෙහෙවර</h2>
						<p>{{viewStatement}}</p>
					</blockquote>
				</script>

				<!-- Right Column -->
				<div class="col-sm-3">
					<!-- List-Group Panel -->
					<div class="card">
						<div class="card-header">
							<h5 class="card-title">
								<span class="glyphicon glyphicon-wrench"></span>Our Services</h5>
						</div>
						<div class="list-group">
							<a href="#" class="list-group-item list-group-item-action">Complain</a>
							<a href="#" class="list-group-item list-group-item-action">Issuing Certificates</a>
							<a href="#" class="list-group-item list-group-item-action">Rates Payments</a>
							<a href="#" class="list-group-item list-group-item-action">Application for Water Bowser</a>
							<a href="#" class="list-group-item list-group-item-action">Application for Gully Bowser</a>
							<a href="#" class="list-group-item list-group-item-action">Street Light Complain</a>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Footer -->
		<footer class="footer" style="background-color:#f5f5f5; position:absolute; height:50px; width:100%; line-height: 50px; margin-top:20px;">
			<!-- Copyright -->
			<div class="footer-copyright text-center text-muted" style="font-size:small">©
				<a href="./home.html"> www.dolgnwp.lk</a> Developed by Wayamba Development Authority
			</div>
		</footer>

		<!-- jQuery -->
		<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
		        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
		        crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
		        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
		        crossorigin="anonymous"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js"
		        integrity="sha512-STof4xm1wgkfm7heWqFJVn58Hm3EtS31XFaagaa8VMReCXAkQnJZ+jEy8PCC/iT18dFy95WcExNHFTqLyp72eQ=="
		        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
		        integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
		        crossorigin="anonymous"></script>
		<!-- MustacheJS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.1.0/mustache.min.js"
		        integrity="sha512-WJoegbZkRk/oQbcp2Nm2JfgrHHyHdhaHns2g74rXFRxxy+E+syUWQCiZxSzGo0662p/GQEVXDkg6ImtSR60DHg=="
		        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<!-- IE10 viewport bug workaround -->
		<script src="./js/ie10-viewport-bug-workaround.js"></script>
		<!-- Placeholder Images -->
		<script src="./js/holder.min.js"></script>
		<!-- bootstrap-select compiled and minified JavaScript -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
	</body>

	<script id="meta-data-tmpl" type="x-tmpl-mustache">
			<title>{{name}}</title>
			<link rel="icon" type="image/png" href={{favicon}}>
	</script>

	<script id="navi-name-tmpl" type="x-tmpl-mustache">
			<h4 class="title-top">{{name}} Council</h4>
	</script>

	<script id="navi-logo-tmpl" type="x-tmpl-mustache">
			<img src={{logo}} width="90" height="90">
	</script>

	<script>
		$(document).ready(function () {
			let template
			let rendered

			// Render head metadata
			template = $("#meta-data-tmpl").html()
			rendered = Mustache.render(template, localAuthorityObj)
			$("head").append(rendered)

			template = $("#navi-name-tmpl").html()
			rendered = Mustache.render(template, localAuthorityObj)
			$("#name-nav").append(rendered)

			template = $("#navi-logo-tmpl").html()
			rendered = Mustache.render(template, localAuthorityObj)
			$("#logo-nav").append(rendered)

			$.ajax({
				type: "GET", url: `http://localhost:8080/api/local-auths/${localAuthorityId}`,
				success: function (result) {
					console.log(result)
					template = $("#statements-tmpl").html()
					rendered = Mustache.render(template, result)
					$("#statements-text").append(rendered)
				},
				error: function (xhr) {
					console.log(`An error occurred: ${xhr.status} ${xhr.statusText}`)
				}
			})
		})
	</script>
</html>
