<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="Access web pages of Sri Lankan Local Authorities">
		<meta name="author" content="Wayamba Development Authority">
		<title>Department of Local Government</title>
		<!-- Favicon -->
		<link rel="icon" type="image/png" href="assets/img/favicon-16x16.png">
		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<!-- Bootstrap-Select CSS -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
		<!-- Custom Global CSS -->
		<link rel="stylesheet" type="text/css" href="assets/css/custom-global.css">
	</head>
	<body>
		<!-- Navigation -->
		<div class="container-fluid" style="background-color:#900; margin-bottom:20px;">
			<div class="row" style="align-items: center; justify-content: space-between; height:100px;">
				<div class="col-md-5 text-md-center">
					<h4 class="title-top">DEPARTMENT OF LOCAL GOVERNMENT</h4>
				</div>
				<div class="col-sm-2" style="margin-top:10px; margin-bottom:10px;">
					<img src="assets/img/main-logo.png" alt="" style="height:80px; width:70px">
				</div>
			</div>
		</div>

		<div class="form container border">
			<br><br><br>
			<div class="form-group row justify-content-md-center">
				<div class="col-md-6">
					<label for="district-picker">District</label>
					<select id="district-picker" class="selectpicker form-control"
					        title="Choose one of the Districts..."
					        data-live-search="true"
					        disabled>
					</select>
				</div>
			</div>
			<br>
			<div class="form-group row justify-content-md-center">
				<div class="col-md-6">
					<label for="localauthority-picker">Local Authority</label>
					<select id="localauthority-picker" class="selectpicker form-control"
					        title="Choose one of the Authorities..."
					        data-live-search="true"
					        disabled>
					</select>
				</div>
			</div>
			<br>
			<div class="form-group row justify-content-md-center">
				<div class="col-md-6">
					<button type="button" id="home-button" class="btn btn-primary" disabled>Go to Home</button>
				</div>
			</div>
			<br><br><br>
		</div>

		<!-- Footer -->
		<footer class="footer" style="background-color:#f5f5f5; position:absolute; height:50px; width:100%; line-height: 50px; margin-top:20px;">
			<!-- Copyright -->
			<div class="footer-copyright text-center text-muted" style="font-size:small">©
				<a href="./index.html"> www.dolgnwp.lk</a> Developed by Wayamba Development Authority
			</div>
		</footer>

		<!-- JQuery JS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js" integrity="sha512-STof4xm1wgkfm7heWqFJVn58Hm3EtS31XFaagaa8VMReCXAkQnJZ+jEy8PCC/iT18dFy95WcExNHFTqLyp72eQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<!-- Popper JS -->
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
		<!-- Bootstrap JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
		<!-- Mustache JS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.1.0/mustache.min.js" integrity="sha512-WJoegbZkRk/oQbcp2Nm2JfgrHHyHdhaHns2g74rXFRxxy+E+syUWQCiZxSzGo0662p/GQEVXDkg6ImtSR60DHg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<!-- Bootstrap-Select JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
	</body>
	<script>
		let hostName = `${document.location.protocol}//${document.location.hostname}`
		$(document).ready(function () {
			let districtPicker = $("#district-picker")
			let localAuthorityPicker = $("#localauthority-picker")
			let homeButton = $("#home-button")
			let districtId
			let localAuthorityId
			let localAuthorityObj

			districtPicker.on("change", function () {
				// Remove selected option
				localAuthorityPicker.empty()
				homeButton.prop("disabled", true)
				districtId = this.value
				// Get Local Authority for selected District
				$.ajax({
					type: "GET",
					url: `${hostName}:8080/api/local-auths?district-id=${districtId}`,
					success: function (result) {
						let template = "{{#.}}" +
						               "<option value={{id}} data-name_sl={{name_sl}} data-name_ta={{name_ta}} data-name_en={{name_en}} data-favicon={{favicon}} data-logo={{favicon}}>" +
						               "{{name_sl}}" +
						               "</option>" +
						               "{{/.}}"
						localAuthorityPicker.append(Mustache.render(template, result))
						localAuthorityPicker.prop("disabled", false)
						localAuthorityPicker.selectpicker("render")
						localAuthorityPicker.selectpicker("refresh")
					},
					error: function (xhr) {
						console.log(`An error occurred: ${xhr.status} ${xhr.statusText}`)
					}
				})
			})

			localAuthorityPicker.on("change", function () {
				localAuthorityId = this.value
				let selectedOption = $(this).find(":selected")
				localAuthorityObj = {
					"name_sl": selectedOption.data("name_sl"),
					"name_en": selectedOption.data("name_en"),
					"name_ta": selectedOption.data("name_ta"),
					"favicon": selectedOption.data("favicon"),
					"logo": selectedOption.data("logo")
				}
				homeButton.prop("disabled", false)
			})

			// Save selected data
			homeButton.on("click", function () {
				localStorage.setItem("districtId", districtId)
				localStorage.setItem("localAuthorityId", localAuthorityId)
				localStorage.setItem("localAuthorityObj", JSON.stringify(localAuthorityObj))
				window.location.href = "./home.html"
			})

			// Get all Districts
			$.ajax({
				type: "GET", url: `${hostName}:8080/api/districts`,
				success: function (result) {
					let template = "{{#.}}<option value={{id}}>{{name}}</option>{{/.}}"
					districtPicker.append(Mustache.render(template, result))
					districtPicker.prop("disabled", false)
					districtPicker.selectpicker("render")
					districtPicker.selectpicker("refresh")
				},
				error: function (xhr) {
					console.log(`An error occurred: ${xhr.status} ${xhr.statusText}`)
				}
			})
		})
	</script>
</html>
