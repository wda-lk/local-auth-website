<!DOCTYPE html>
<html lang="en">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
		<!-- server -->
		<title>Department of Local Government</title>
		<!-- server -->
		<link rel="icon" type="image/png" href="./images/favicon-16x16.png">
		<!-- Bootstrap Core CSS -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
		      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<!-- Custom CSS: You can use this stylesheet to override any Bootstrap styles and/or apply your own styles -->
		<link rel="stylesheet" type="text/css" href="./css/custom.css">
		<!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
		<!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
		<!--[if lt IE 9]>
		<script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
		<script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
		<![endif]-->
		<!-- bootstrap-select CSS -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
	</head>
	<body>
		<!-- Navigation -->
		<div class="container-fluid" style="background-color:#900; margin-bottom:20px;">
			<div class="row text-sm-left" style="align-items: center; justify-content: space-between;">
				<div class="col-sm-5">
					<h4 class="title-top">DEPARTMENT OF LOCAL GOVERNMENT</h4>
				</div>
				<div class="col-sm-2" style="margin-top:10px; margin-bottom:10px;">
					<img src="./images/main-logo.png" alt="" style="height:80px; width:70px">
				</div>
			</div>
		</div>

		<div class="form container border">
			<br><br><br>
			<div class="form-group row justify-content-md-center">
				<div class="col-md-6">
					<label for="district-picker">District</label>
					<select id="district-picker" class="selectpicker form-control"
					        title="Choose one of the Districts..."
					        data-live-search="true"
					        disabled>
					</select>
				</div>
			</div>
			<br>
			<div class="form-group row justify-content-md-center">
				<div class="col-md-6">
					<label for="localauthority-picker">Local Authority</label>
					<select id="localauthority-picker" class="selectpicker form-control"
					        title="Choose one of the Authorities..."
					        data-live-search="true"
					        disabled>
					</select>
				</div>
			</div>
			<br>
			<div class="form-group row justify-content-md-center">
				<div class="col-md-6">
					<button type="button" id="home-button" class="btn btn-primary" disabled>Go to Home</button>
				</div>
			</div>
			<br><br><br>
		</div>

		<!-- Footer -->
		<footer class="footer" style="background-color:#f5f5f5; position:absolute; height:50px; width:100%; line-height: 50px; margin-top:20px;">
			<!-- Copyright -->
			<div class="footer-copyright text-center text-muted" style="font-size:small">©
				<a href="./index.html"> www.dolgnwp.lk</a> Developed by Wayamba Development Authority
			</div>
		</footer>

		<!-- boostrap 4 -->
		<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
		        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
		        crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
		        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
		        crossorigin="anonymous"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js"
		        integrity="sha512-STof4xm1wgkfm7heWqFJVn58Hm3EtS31XFaagaa8VMReCXAkQnJZ+jEy8PCC/iT18dFy95WcExNHFTqLyp72eQ=="
		        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
		        integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
		        crossorigin="anonymous"></script>
		<!-- MustacheJS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.1.0/mustache.min.js"
		        integrity="sha512-WJoegbZkRk/oQbcp2Nm2JfgrHHyHdhaHns2g74rXFRxxy+E+syUWQCiZxSzGo0662p/GQEVXDkg6ImtSR60DHg=="
		        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<!-- IE10 viewport bug workaround -->
		<script src="./js/ie10-viewport-bug-workaround.js"></script>
		<!-- Placeholder Images -->
		<script src="./js/holder.min.js"></script>
		<!-- bootstrap-select compiled and minified JavaScript -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
	</body>
	<script>
		$(document).ready(function () {
			let districtPicker = $("#district-picker")
			let localAuthorityPicker = $("#localauthority-picker")
			let homeButton = $("#home-button")
			let districtId
			let localAuthorityId

			districtPicker.on("change", function () {
				// Remove selected option
				localAuthorityPicker.empty()
				homeButton.prop("disabled", true)
				districtId = this.value
				// Get Local Authority for selected District
				$.ajax({
					type: "GET",
					url: `http://localhost:8080/api/local-auths?district-id=${districtId}`,
					success: function (result) {
						let template = "{{#.}}<option value={{id}}>{{name}}</option>{{/.}}"
						localAuthorityPicker.append(Mustache.render(template, result))
						localAuthorityPicker.prop("disabled", false)
						localAuthorityPicker.selectpicker("render")
						localAuthorityPicker.selectpicker("refresh")
					},
					error: function (xhr) {
						console.log(`An error occurred: ${xhr.status} ${xhr.statusText}`)
					}
				})
			})

			localAuthorityPicker.on("change", function () {
				localAuthorityId = this.value
				homeButton.prop("disabled", false)
			})

			// Save selected data
			homeButton.on("click", function () {
				localStorage.setItem("districtId", districtId)
				localStorage.setItem("localAuthorityId", localAuthorityId)
				window.location.href = "./home.html"
			})

			// Get all Districts
			$.ajax({
				type: "GET", url: "http://localhost:8080/api/districts",
				success: function (result) {
					let template = "{{#.}}<option value={{id}} obj={{.}}>{{name}}</option>{{/.}}"
					districtPicker.append(Mustache.render(template, result))
					districtPicker.prop("disabled", false)
					districtPicker.selectpicker("render")
					districtPicker.selectpicker("refresh")
				},
				error: function (xhr) {
					console.log(`An error occurred: ${xhr.status} ${xhr.statusText}`)
				}
			})
		})
	</script>
</html>
